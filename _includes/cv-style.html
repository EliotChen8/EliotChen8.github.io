<style>
/* CV page styles — scoped to .cv-tex, inherits the site's font and colors */
.cv-tex { line-height: 1.5; }
/* the theme's JSON-CV stylesheet also styles .cv-header (border + padding): reset it */
.cv-tex .cv-header { margin-bottom: 0; padding: 0; border: 0; }
.cv-tex .cv-header p { margin: 0; }
.cv-tex .cv-vgap { display: block; }   /* height comes from LaTeX's \\[len] */
.cv-tex .cv-large { font-size: 1.6em; line-height: 1.3; }

/* Section bars follow \resumesection in _cv/main.tex (\vspace 0.75em around an mdframed box with
   0.75em inner top/bottom margins, a 0.5em left rule and a 1em inner left margin). The values below
   are calibrated against the compiled PDF, measured as ink distances in body-font em: bar height
   2.24, text above to bar 1.30 (0.83 right after the header), bar to text below 0.80. TeX and CSS
   place lines differently, so the CSS numbers are not the TeX numbers; re-measure if main.tex changes. */
/* margin-bottom: the JSON-CV stylesheet also gives .cv-section a 2rem bottom margin: reset it */
.cv-tex .cv-section { margin: 1em 0 0; }
.cv-tex .cv-header + .cv-section { margin-top: 0.6em; }
.cv-tex .cv-section > :last-child { margin-bottom: 0; }
.cv-tex .cv-section > h2 {
  font-size: 1em;
  letter-spacing: 0.06em;
  margin: 0 0 0.33em;
  padding: 0.535em 0 0.535em 1em;
  border-left: 0.5em solid currentColor;
  border-bottom: none;
  background: rgba(127, 127, 127, 0.12);
}
.cv-tex .cv-section > p { margin: 0.6em 0 0.2em; }
.cv-tex .cv-section > h2 + p { margin-top: 0; }

.cv-tex .cv-entry { margin-bottom: 1em; }
.cv-tex .cv-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 1em;
}
.cv-tex .cv-row > :last-child { text-align: right; flex-shrink: 0; }
.cv-tex .cv-sub { font-size: 0.95em; }

/* Bullets: the PDF's \textbullet is a small dot (0.28em across, centre 0.35em above the baseline,
   ink ending 0.58em before the text, text indented 1em). The browser-drawn list-style disc is bigger
   (0.33em), lower and further from the text, so draw the body font's U+2022 instead: in TeX Gyre
   Termes it is 0.27em across with its centre 0.33em up, and left: -0.87em puts its ink 0.58em
   before the text. */
.cv-tex .cv-list { margin: 0.25em 0 0; padding-left: 1em; list-style: none; }
.cv-tex .cv-list li { margin: 0.2em 0; list-style: none; position: relative; }
.cv-tex .cv-list li::before { content: "\2022"; content: "\2022" / ""; position: absolute; left: -0.87em; }

.cv-download { margin: 0 0 1.5em; }

@media (max-width: 600px) {
  .cv-tex .cv-row { flex-direction: column; gap: 0; }
  .cv-tex .cv-row > :last-child { text-align: left; flex-shrink: 1; font-weight: normal; opacity: 0.8; }
}
</style>
